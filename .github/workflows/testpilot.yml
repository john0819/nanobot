name: TestPilot evidence gate

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/testpilot-*']
    paths: ['testpilot/**', 'runner/**', 'scripts/testpilot_*smoke.py', 'testpilot-compose.yml', 'nanobot/cli/commands.py', 'tests/testpilot/**', 'pyproject.toml', '.github/workflows/testpilot.yml']
  pull_request:
    paths: ['testpilot/**', 'runner/**', 'scripts/testpilot_*smoke.py', 'testpilot-compose.yml', 'nanobot/cli/commands.py', 'tests/testpilot/**', 'pyproject.toml', '.github/workflows/testpilot.yml']

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TESTPILOT_DATABASE_URL: postgresql://testpilot:ci-fixture-password-only@127.0.0.1:5432/testpilot
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: testpilot
          POSTGRES_DB: testpilot
          POSTGRES_PASSWORD: ci-fixture-password-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U testpilot -d testpilot"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Focused lint and strict type check
        run: |
          ruff check testpilot runner tests/testpilot scripts/testpilot_live_smoke.py scripts/testpilot_crash_smoke.py scripts/testpilot_async_smoke.py scripts/testpilot_controls_smoke.py
          basedpyright testpilot
      - name: Build fixed isolated Runner
        run: |
          docker build -f runner/Dockerfile -t testpilot-runner:dev .
          echo "TESTPILOT_RUNNER_IMAGE=$(docker image inspect --format '{{.Id}}' testpilot-runner:dev)" >> "$GITHUB_ENV"
      - name: Evidence contracts and real execution
        run: python -m pytest tests/testpilot -q
      - name: nanobot and QA integration compatibility
        run: >-
          python -m pytest tests/agent/test_runner_core.py
          tests/agent/test_runner_tool_execution.py tests/agent/test_runner_hooks.py
          tests/agent/test_builtin_qa_knowledge_skill.py tests/evals/test_qa_agent_evaluator.py -q
      - name: Real fixture demos and unsupported claim rejection
        run: |
          python scripts/testpilot_live_smoke.py
          python scripts/testpilot_crash_smoke.py
          python scripts/testpilot_async_smoke.py
          python scripts/testpilot_controls_smoke.py
          python -m testpilot --mode healthy
          python -m testpilot --mode retry-write-bug
          if python -m testpilot --mode retry-write-bug --claim-all-passed; then
            echo "Expected evidence gate rejection"
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testpilot-real-execution
          path: |
            .local/testpilot/
            .local/testpilot-live-smoke/
            .local/testpilot-crash-smoke/
            .local/testpilot-async-smoke/
            .local/testpilot-controls-smoke/
          include-hidden-files: true
          retention-days: 7
